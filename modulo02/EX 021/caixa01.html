<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de Caixas</title>
    <style>
        h1 { /*box-level*/
            background-color: aqua;

            height: 300px;
            width: 300px;

            /* FORMA NAO SIMPLIFICADA

            border-top: 10px;
            border-style: solid;
            border-color: blue;
               A DEBAIXO É A FORMA SIMPLIFICADA
            */

            border: 10px solid blue;
           
            /*
            FORMA NAO SIMPLIFICADA

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

               A DEBAIXO É A FORMA SIMPLIFICADA
            */
            padding: 10px;

           /*
            FORMA NAO SIMPLIFICADA

            margin-top: 20px;
            margin-right: autopx;
            margin-bottom: 40px;
            margin-left: autopx;

               A DEBAIXO É A FORMA SIMPLIFICADA
            */
            margin: 20px auto 40px auto;

            
           /*
            FORMA NAO SIMPLIFICADA

            outline-width: 5px;
            outline-style: dashed;
            outline-color: chartreuse;
            
               A DEBAIXO É A FORMA SIMPLIFICADA
            */
            outline: 5px dashed chartreuse; 
        }
        a { /*inline-level*/
            border-width: 5px;
            border-style: dashed;
            border-color: rgb(255, 0, 0);
            padding-top: 0px;
            padding-left: 5px;
            padding-right: 5px;
            padding-bottom: 0px;
        }
        p {
            margin-top: 20px;
        }
        /* Podemos mudar um elemento de box-level para inline-level usando o "display: inline;" ou "display: block;" para fazer o contrario*/
    </style>
</head>
<body>
    <h1>Exemplo de Caixa Box-Level</h1>
    <p>Paragrafos tambem sao exemplos de box-level, mas os links -> <a href="#"> sao exemplos de caixas inline-level</a>vamos ver como tudo isso funciona</p>
</body>
</html>
