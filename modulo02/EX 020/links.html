<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>links</title>

    <style>
        /*  #  = id
            .  = class
            :  = pseudo-class
            :: = pseudo-element
            >  = children
        */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: blue;
            text-decoration: none;
            font-weight: bolder;
        }
        a:visited {
            color: red;
        }
        a:hover {
            color: chartreuse;
            text-decoration: underline;
        }
        a:active {
            color: gold;
        }

        .especial {
            background-color: blueviolet;
            
        }

        .especial::before {
            content: "--> ";
        }
        .especial::after {
            content: " <--";
        }

        /*
        para chamar um pseudo elemento sao usados dois pontos duas vezes "::" .
        */


    </style>
</head>
<body>
    <h1>personalizando links</h1>
    <ul>
        <li><a href="https://www.instagram.com/lincoln_df/" target="_blank" class="especial">instagran</a></li>
        <li><a href="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-2-de-5-40-horas/aulas/modulo-2-2/modulos/capitulo-15-aula-04-pseudo-elementos-em-css/" target="_blank" >curso</a></li>
        <li><a href="https://www.youtube.com/watch?v=vMlrcOVr7po&list=PLHz_AreHm4dlUpEXkY1AyVLQGcpSgVF8s&index=22"
            target="_blank"  class="especial">youtube</a></li>
    </ul>
</body>
</html>
