<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <style>
        /*height = altura 
            width = largura*/  
        div{
            display:inline-block;       background-color: aqua;
            border: 1px solid black;
            text-align: center;
            height: 200px;
            width: 200px;
        }

        div#d1:hover {
            background-color: rgb(255, 0, 0);
        }
        
        /*pseudo sao palavras de definem estados de elementos e classes no HTML (se ele esta ativo, marcado ou algo do tipo).
      para chamar a pseudo classe usamos o dois ponto " : " da mesma forma que usamos o # e o . para chamar o ID e a CLASSE
       */


    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
