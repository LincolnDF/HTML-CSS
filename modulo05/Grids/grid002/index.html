<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    
    <style>
        div.conteiner {
            display: grid;
            gap: 10px;
/*--------------------------------------------------*/
        /* grid-template-rows: auto auto  auto ;
           grid-template-columns: auto auto auto; */

           /* ShortHand */
            
           grid-template: auto auto auto / auto auto auto;
            /*
           podemos substituir adicionando a funçao REPEAT() 
           Exemplo: 
           repeat(3, auto)
           repeat(3, 100px) 
            */
/* ------------------------------------------------ */
            /* 
            aligh-items e align-content -> alinham o o conteudo verticalmente

            justify-items e justify-content alinham o conteudo horizontalmente
            */
/* ------------------------------------------------ */
            /* align-items: center;
            justify-items: center;

            align-content: space-between;
            justify-content: space-between; */

            /* ShortHand */

            place-items: center center ;
            place-content: space-between space-between;
/* ------------------------------------------------ */
            
            height: 250px;
            border: 3px dotted blue;
        }
        
        div.item {
            border: 3px solid red;
            padding: 5px;
        }

    
    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
    </div>
</body>
</html>
