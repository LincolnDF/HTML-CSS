<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na pratica</title>
    
    <style>
        div.conteiner {
            display: grid;
            gap: 10px;
            border: 3px dotted blue;
            
            grid-template-rows: reapet(3, 80px);
            grid-template-columns: 1fr 4fr 1fr;
            
            /* grid-template-columns: 100px 40% repeat(2, 1fr); */

            grid-auto-rows: 80px;
            /* "grid-auto-rows" define o tamano das linhas adicionais */

            

            grid-auto-columns: 120px;
            /* "grid-auto-columns" define o tamanho das colunas adicionais */

            grid-auto-flow: row;
            /* "grid-auto-flow" Define se o conteudo adicional vai ser colocado em coluna ou em linha  row ou column */
            

            place-items: normal normal;
            place-content: normal normal;
            
        }

        
        
        div.item {
            border: 3px solid red;
            padding: 5px;
        }

    
    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
