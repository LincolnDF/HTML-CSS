<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <!-- 
    align-content 
    -->


    <!-- 
    justify-content - alinha os itens no eixo principal
    
    align-items - alinha os itens dentro do eixo transversal

    align-content - alinha os elementos no eixo transversal quando estao empacotados(com wrap)
    -->

  <style>
        div.conteiner{
            display: flex;
            flex-flow: row wrap;
            align-content: space-evenly;
            
            background-color: aqua;
            height: 400px;
        }

        div.item {
            
            text-align: center;
            background-color: blueviolet;
            border: 1px solid black;
            padding: 40px;
        }
    </style>




</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">j</div>
        <div class="item">K</div>
        <div class="item">L</div>
        <div class="item">M</div>
        <div class="item">N</div>
        <div class="item">O</div>
    </div> 
</body>
</html>
