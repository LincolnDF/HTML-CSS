<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <!-- 
    flex-basis
    -->

    <style>
        div.conteiner{
            display: flex;
            flex-flow: row wrap;
            background-color: aqua;
        }

        div.item {   
            flex-basis: 150px;
            
            
            text-align: center;
            background-color: blueviolet;
            border: 1px solid black;

        }
    </style>




</head>
<body>
    <div class="conteiner">
        <div class="item">Aaaaaaa</div>
        <div class="item">B</div>
        <div class="item">Cccccccccccc</div>
        <div class="item">D</div>
        <div class="item">Eeeeeeeeeee   eeee  eeeee   eeeeeeeee</div>
        <div class="item">F</div>
        <div class="item">Ggggg      ggg   gggggg    gggggggggg</div>
    </div> 
</body>
</html>
