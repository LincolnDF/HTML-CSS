<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

<!--
flex-shrink
flex-grow 
-->

<!-- 
shorthand
-------------
flex-basis: 250px;
flex-grow: 1;
flex-shrink: 0;

flex: 1 0 250px;
-->
    <style>
        div.conteiner{
            display: flex;
            flex-flow: row nowrap;
            
            background-color: aqua;
        }

        div.item {
            flex-basis: 250px;
            

            text-align: center;
            background-color: blueviolet;
            border: 1px solid black;
        }

        div#cxa {
            flex-shrink: 1;
            flex-grow: 1;
        }
        div#cxb {
            flex-shrink: 1;
            flex-grow: 4;

        }
        div#cxc {
            flex-shrink: 1;
            flex-grow: 8;

        }
    </style>




</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
    </div> 
</body>
</html>
