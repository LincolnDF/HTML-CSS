<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

<!--
    
flex-shrink
flex-grow 
flex-basis

----------------------------
shothand 
----------------------------

padrao 
flex: 0 1 auto;   ou   flex: initial;

deixar os elementos nao flexiveis 
flex: 0 0 auto;  ou  flex: none;

elementos totalmente flexivel 
flex: 1 1 auto;  ou   flex: auto;

------------------------------

flex: 3  e a mesma coisa que 
flex: 3 1 auto;

um valor so, so muda o valor de FLEX-GROW e dixa os outros no valor padrao

-->

    <style>
        div.conteiner{
            display: flex;
            flex-flow: row nowrap;
            
            background-color: aqua;
        }

        div.item {
            
            
            text-align: center;
            background-color: blueviolet;
            border: 1px solid black;
        }
        
        div#cxa {
            /* 
            flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;
            */

            flex: 1 0 200px;
        }
        div#cxb {
            /*
             flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 250px;
             */

            flex: 1 1 250px;

        }
        div#cxc {
            /* 
            flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;
             */

            flex: 1 8 auto;

        }
    </style>




</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
    </div> 
</body>
</html>
