<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>

<!-- labem é usado para criar uma ligaçao com o imput e o etiqueta, (nesse caso nome e sobrenome) -->

<!-- method="POST" > serve para ocultar as informações da URL do site
     method="GET"(padrao)> serve para mostrar as informações na URL do site  -->

<body>
    <h1>Meu primeiro formulario</h1>
    <form action="cadastro.php" autocomplete="off" method="post">
        <p><label for="inome">Nome:</label> 
            <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome:</label> 
            <input type="text" name="sobrenome" id="isobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
