<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="post" autocomplete="on">

        <p>
            <label for="iestado">Estado:</label>
            <select name="estado" id="iestado">


                <optgroup label="Sudeste">
                    <option value="MG">Minas Gerais</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP" selected>Sao Paulo</option>
                </optgroup>
                <optgroup label="Nordeste">
                    <option value="MA">Maranhao</option>
                    <option value="PE">Pernambuco</option>
                    <option value="RN">Rio Grande do Norte</option>
                </optgroup>
            </select>
        </p>

        
        <p>
            <label for="iprof">Profissao:</label>
            <input type="text" name="profissao" id="iprof" list="lista">
            <datalist id="lista">
                <option value="ADM">Administrador</option>
                <option >Professor</option>
                <option value="CONT">Contabilista</option>
            </datalist>
        </p>

        <p>
            <label for="imens">Mensagen:</label> <br>
            <textarea name="mensagem" id="imens" cols="30" rows="10" placeholder="Sua mensagem aqui..."></textarea>
        </p>
    
        






        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
