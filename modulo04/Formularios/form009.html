<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on"></form>

    <!-- Usando o OUTPUT no INPUT Range para mostrar o valor  -->

    <p>
        <label for="inun">Numero :</label>
        <input type="range" name="nun" id="inun" value="0" min="0" max="10" oninput="ival.innerHTML = Number(inun.value)">
        <output id="ival">0</output>
    </p>










    
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
</body>
</html>
